name: Actualizar datos

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar data.csv
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "transitabilidad-bot"
          git config user.email "transitabilidad-bot@users.noreply.github.com"
          git add data.csv datapackage.json readme.md
          git commit -m "[ci] actualización"
          git push
